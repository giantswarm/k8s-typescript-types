- group: fluxcd
  resources:
    # Flux keeps serving deprecated API versions for a while and then drops
    # them, so no single CRD release covers every version our clusters may
    # serve. Each resource therefore lists one CRD release per API version we
    # support: the newest release that still serves that version, which is the
    # most complete schema for it. Sources are listed oldest first, so that a
    # version served by several of them resolves to the newest.
    #
    # The oldest entry is bounded by the Flux release flux-app deploys on Giant
    # Swarm management clusters (currently 2.6.4), the newest by the latest Flux
    # release (currently 2.9.3). When either moves, re-check which release last
    # serves each version and drop versions no cluster serves any more.
    - name: HelmRelease
      crdURLs:
        # v2beta1 (also serves v2, v2beta2)
        - https://raw.githubusercontent.com/fluxcd/helm-controller/e47f47f1282d1c66b180be7a386f5afbe3f5ae26/config/crd/bases/helm.toolkit.fluxcd.io_helmreleases.yaml  # v1.3.0
