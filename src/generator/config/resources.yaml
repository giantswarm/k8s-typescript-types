- group: kagent
  resources:
    # kagent CRDs come from two sources while the Agent Platform moves from
    # kagent API v1 to API v2:
    #
    # 1. Upstream kagent v0.9.9 (`kagent.dev/v1alpha1`, `v1alpha2`): the API the
    #    Agent Platform 3.x releases run on Giant Swarm management clusters.
    #    `Agent` exists only there. These versions are removed in a later major
    #    of this package, once no consumer compiles against them any more.
    #
    # 2. The kagent API v2 line the Agent Platform 4.x releases run
    #    (`kagent.dev/v1alpha3`): giantswarm/kagent-upstream, branch
    #    `giantswarm` -- upstream kagent `main` at a pinned commit plus carried
    #    patches. Upstream has not released API v2, so there is no upstream tag
    #    to pin to. The CRDs are the `kagent-crds` chart's templates (plain
    #    YAML, byte-identical to `go/api/config/crd/bases/`).
    #
    #    Pinned to commit 0ac524031db451634359df3081d7d5d08cea4c93 of that line,
    #    which is upstream kagent `main` 4a91c27330e8 plus the line's carried
    #    commits. Pin a commit SHA, never the branch: the branch is force-pushed
    #    on every re-pin onto upstream `main`, and the fork's plain `vX.Y.Z`
    #    tags are upstream mirrors, not releases of the line. Once the line
    #    publishes a release tag (`vX.Y.Z-gs.N`), pin that tag's commit and name
    #    the tag here.
    #
    #    Re-pinning: the line re-pins onto upstream `main` regularly. A re-pin
    #    that changes any of these CRDs is a new release of this package, which
    #    the consumers (the Dev Portal) then move their pin to.
    - name: Agent
      crdURL: https://raw.githubusercontent.com/kagent-dev/kagent/v0.9.9/go/api/config/crd/bases/kagent.dev_agents.yaml
    - name: ModelConfig
      crdURLs:
        # v1alpha1, v1alpha2
        - https://raw.githubusercontent.com/kagent-dev/kagent/v0.9.9/go/api/config/crd/bases/kagent.dev_modelconfigs.yaml
        # v1alpha3
        - https://raw.githubusercontent.com/giantswarm/kagent-upstream/0ac524031db451634359df3081d7d5d08cea4c93/helm/kagent-crds/templates/kagent.dev_modelconfigs.yaml
    - name: AgentTemplate
      crdURL: https://raw.githubusercontent.com/giantswarm/kagent-upstream/0ac524031db451634359df3081d7d5d08cea4c93/helm/kagent-crds/templates/kagent.dev_agenttemplates.yaml
    - name: Harness
      crdURL: https://raw.githubusercontent.com/giantswarm/kagent-upstream/0ac524031db451634359df3081d7d5d08cea4c93/helm/kagent-crds/templates/kagent.dev_harnesses.yaml
    - name: RemoteMCPServer
      crdURL: https://raw.githubusercontent.com/giantswarm/kagent-upstream/0ac524031db451634359df3081d7d5d08cea4c93/helm/kagent-crds/templates/kagent.dev_remotemcpservers.yaml
    - name: ModelProviderConfig
      crdURL: https://raw.githubusercontent.com/giantswarm/kagent-upstream/0ac524031db451634359df3081d7d5d08cea4c93/helm/kagent-crds/templates/kagent.dev_modelproviderconfigs.yaml
