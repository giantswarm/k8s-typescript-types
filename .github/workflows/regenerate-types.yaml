# Regenerates the types on Renovate PR branches and pushes the result back onto
# the branch, so that a generator dependency bump arrives with its regenerated
# types and the PR diff shows every type it changes. The Mend-hosted Renovate
# app cannot run postUpgradeTasks.
#
# The bot token never shares a job with dependency code. `regenerate` installs
# and runs the bumped packages with no secrets and hands over its changes as a
# patch. `push` runs no package code: it applies the patch, provided it only
# touches generated files, and pushes with the taylorbot PAT. A GITHUB_TOKEN
# push would not trigger CI on the new commit. That CI run finds nothing to
# change, so this never loops. renovate-custom.json5 lists taylorbot in
# gitIgnoredAuthors, so Renovate keeps rebasing the branch.
name: Regenerate types

on:
  pull_request:
    paths:
      - 'package.json'
      - 'yarn.lock'

permissions: {}

jobs:
  regenerate:
    name: Regenerate
    # Only Renovate branches in this repository: on a human's PR the author
    # commits the types, and a fork's branch is not ours to push to.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.head_ref, 'renovate/')
    # A newer head supersedes this run. Only this job is cancellable: the run
    # that taylorbot's push triggers must not cancel the push job that made it.
    concurrency:
      group: regenerate-types-${{ github.head_ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-scripts
      # Starts from a clean tree, so a type the generator no longer emits shows
      # up as deleted files. If any CRD fails to fetch or generate, nothing is
      # written and the job fails.
      - run: yarn regenerate
      - name: Collect the changes as a patch
        id: diff
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --binary --no-renames > regenerated.patch
          if [ -s regenerated.patch ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "generated types already in sync, nothing to push"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.diff.outputs.changed == 'true'
        with:
          name: regenerated-patch
          path: regenerated.patch
          retention-days: 1

  push:
    name: Push the regenerated types
    needs: regenerate
    if: needs.regenerate.outputs.changed == 'true'
    concurrency:
      group: regenerate-types-push-${{ github.head_ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check the bot token is available
        env:
          TAYLORBOT_GITHUB_ACTION: ${{ secrets.TAYLORBOT_GITHUB_ACTION }}
        run: |
          if [ -z "$TAYLORBOT_GITHUB_ACTION" ]; then
            echo "::error::TAYLORBOT_GITHUB_ACTION is not available to this run, the regenerated types cannot be pushed."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: regenerated-patch
          path: ${{ runner.temp }}
      - name: Apply the patch if it only touches generated files
        env:
          PATCH: ${{ runner.temp }}/regenerated.patch
        run: |
          set -euo pipefail
          outside="$(git apply --numstat "$PATCH" | cut -f3- | grep -Ev '^((src/types/crds|dist/types)/|README\.md$)' || true)"
          if [ -n "$outside" ]; then
            echo "::error::The regenerated patch touches files outside src/types/crds/, dist/types/ and README.md:"
            echo "$outside"
            exit 1
          fi
          if git apply --summary "$PATCH" | grep -E 'mode (change|120000)'; then
            echo "::error::The regenerated patch changes file modes or adds symlinks."
            exit 1
          fi
          git apply --index "$PATCH"
          # README.md may only change inside the generated table.
          outside_table() {
            sed '/<!-- generated:types-overview:start -->/,/<!-- generated:types-overview:end -->/d'
          }
          if ! diff <(git show HEAD:README.md | outside_table) <(outside_table < README.md) > /dev/null; then
            echo "::error::The regenerated patch changes README.md outside the generated types table."
            exit 1
          fi
      - name: Commit and push
        env:
          TOKEN: ${{ secrets.TAYLORBOT_GITHUB_ACTION }}
        run: |
          set -euo pipefail
          git config --local user.email "dev@giantswarm.io"
          git config --local user.name "taylorbot"
          git commit -m "chore: regenerate types"
          # Fails if the branch moved since this run started; the run for the
          # new head regenerates again.
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${GITHUB_HEAD_REF}"
